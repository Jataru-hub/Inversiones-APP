<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inversiones">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Inversiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F1F1EF; --surface:#FFFFFF; --surface-2:#F4F4F2; --ink:#111111; --ink-2:#4A4A47; --muted:#8B8B87; --line:#E7E7E4;
  --strong:#111111; --strong-ink:#FFFFFF;
  --accent:#E8613C; --accent-soft:#FBE4DB; --accent-ink:#B0401E;
  --up:#1E7A45; --down:#C8352A; --up-soft:#E3F2E8; --down-soft:#FBE3E0;
  --shadow:0 10px 30px rgba(0,0,0,.07);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --f:"Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141414; --surface:#1F1F1F; --surface-2:#2A2A2A; --ink:#F1EDE6; --ink-2:#C9C4BC; --muted:#8F8A83; --line:#2E2E2E;
  --strong:#EEE8DE; --strong-ink:#141414;
  --accent:#F07A52; --accent-soft:#3A241B; --accent-ink:#F6A88B;
  --up:#5CC98A; --down:#F2867E; --up-soft:#1C3326; --down-soft:#3A1F1C;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1F1F1F; --surface-2:#2A2A2A; --ink:#F1EDE6; --ink-2:#C9C4BC; --muted:#8F8A83; --line:#2E2E2E;
  --strong:#EEE8DE; --strong-ink:#141414;
  --accent:#F07A52; --accent-soft:#3A241B; --accent-ink:#F6A88B;
  --up:#5CC98A; --down:#F2867E; --up-soft:#1C3326; --down-soft:#3A1F1C;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow-x:hidden}
body{min-height:100vh;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{font-weight:500;letter-spacing:-.035em;margin:0}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
[hidden]{display:none!important}

.wrap{max-width:1100px;margin:0 auto;padding:calc(var(--sat) + 22px) 16px calc(var(--sab) + 28px)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top h1{font-size:38px;letter-spacing:-.045em;flex:1;min-width:0}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Resumen */
.summary{background:var(--strong);color:var(--strong-ink);border-radius:28px;padding:20px 20px 18px}
.sum-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sum-lbl{font-size:13px;opacity:.65}
.sum-big{font-size:40px;font-weight:500;letter-spacing:-.04em;line-height:1.05;margin:6px 0 2px;overflow-wrap:anywhere}
.sum-gain{font-size:16px;font-weight:600}
.summary .up{color:#6FD69A} .summary .down{color:#FF9A90}
:root[data-theme="dark"] .summary .up{color:#1E7A45} :root[data-theme="dark"] .summary .down{color:#C8352A}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .summary .up{color:#1E7A45} :root:not([data-theme="light"]) .summary .down{color:#C8352A} }
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}
.sum-grid .k{font-size:12.5px;opacity:.65} .sum-grid .v{font-size:17px;font-weight:600;letter-spacing:-.01em}
.seg-mini{display:inline-flex;background:rgba(127,127,127,.22);border-radius:999px;padding:3px}
.seg-mini button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;opacity:.75}
.seg-mini button[aria-pressed="true"]{background:var(--strong-ink);color:var(--strong);opacity:1}
.seg-light{background:var(--surface-2)}
.seg-light button[aria-pressed="true"]{background:var(--strong);color:var(--strong-ink)}

.banner{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:12px 14px;margin-top:12px;box-shadow:var(--shadow)}
.banner .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.banner .txt{flex:1;min-width:0;font-size:14px}
.banner .txt b{font-weight:600}
.banner button{font-weight:600;color:var(--accent-ink);white-space:nowrap}
.banner.accent{background:var(--accent);color:#fff}
.banner.accent .dot{background:#fff}
.banner.accent button{color:#fff;text-decoration:underline}

/* Tarjetas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:16px}
.card{position:relative;background:var(--surface);border-radius:26px;padding:16px 16px 14px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.card-top{display:flex;align-items:flex-start;gap:10px}
.card-name{flex:1;min-width:0}
.card-name h3{font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-sub{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ex{background:var(--accent-soft);color:var(--accent-ink)}
.card-val{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-val .v{font-size:28px;font-weight:500;letter-spacing:-.035em}
.card-val .g{font-size:14px;font-weight:600}
.spark{height:64px;margin:2px -4px 0}
.spark svg{width:100%;height:100%;display:block}
.card-foot{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.card-foot span{white-space:nowrap}
.card-foot .sep{opacity:.5}
.quick{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--strong);color:var(--strong-ink);display:grid;place-items:center;flex:none}
.quick svg{width:16px;height:16px}
.card.add{align-items:center;justify-content:center;min-height:200px;background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--muted);font-weight:600;gap:10px}
.card.add .plus{width:52px;height:52px;border-radius:50%;background:var(--strong);color:var(--strong-ink);display:grid;place-items:center}
.card.add .plus svg{width:22px;height:22px}
.empty-note{grid-column:1/-1;color:var(--muted);font-size:14px;padding:4px 4px 0}

.foot{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);font-size:13px;text-align:center}
.foot .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.foot .btn{font-size:14px}
.status{font-size:12.5px}

/* Detalle */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;padding:9px 14px 9px 10px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:16px}
.back svg{width:18px;height:18px}
.d-head{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.d-head h2{font-size:32px;letter-spacing:-.04em;line-height:1.05;flex:1 1 240px;min-width:0;overflow-wrap:anywhere}
.d-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.d-price{font-size:13px;color:var(--muted);margin-top:8px}
.d-main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0 6px}
.d-main .v{font-size:40px;font-weight:500;letter-spacing:-.04em;line-height:1}
.d-main .g{font-size:16px;font-weight:600;margin-top:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:14px 0}
.fact{background:var(--surface);border-radius:20px;padding:12px 14px;min-width:0}
.fact .k{font-size:12.5px;color:var(--muted)}
.fact .v{font-size:19px;font-weight:500;letter-spacing:-.02em;overflow-wrap:anywhere}
.panel{background:var(--surface);border-radius:26px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.panel-head h3{font-size:20px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:6px}
.legend i.dash{border-top:2px dashed var(--muted)}
.legend i.dotm{width:9px;height:9px;border:0;border-radius:50%;background:var(--accent);margin-right:6px}
.chart{position:relative;height:220px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .tip{position:absolute;top:0;pointer-events:none;background:var(--strong);color:var(--strong-ink);border-radius:12px;padding:7px 10px;font-size:12.5px;line-height:1.35;white-space:nowrap;transform:translateX(-50%);box-shadow:var(--shadow);z-index:2}
.chart .tip b{font-weight:600}
.ranges{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.ranges button{flex:1;padding:8px 0;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);min-width:44px}
.ranges button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.no-data{color:var(--muted);font-size:14px;padding:40px 8px;text-align:center}
.moves{display:flex;flex-direction:column}
.move{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 4px;border-top:1px solid var(--line);text-align:left;width:100%}
.move:first-child{border-top:0}
.move .t{font-weight:600}
.move .a{font-weight:600;text-align:right}
.move .s{font-size:12.5px;color:var(--muted)}
.move .s.r{text-align:right}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:12px 18px;font-weight:600;background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.btn.primary{background:var(--strong);color:var(--strong-ink)}
.btn.accent{background:var(--accent);color:#fff;box-shadow:none}
.btn.danger{color:var(--down)}
.btn.solid-danger{background:var(--down);color:#fff}
.btn.small{padding:8px 14px;font-size:14px}
.btn.flat{box-shadow:none;background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.confirm{background:var(--down-soft);border-radius:20px;padding:14px;margin-top:10px;font-size:14px}
.confirm .row{display:flex;gap:8px;margin-top:10px}

/* Hojas (formularios) */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:50;opacity:0;transition:opacity .2s}
.modal.open{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:calc(100dvh - var(--sat) - 12px);border-radius:28px 28px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .22s ease;overflow:hidden}
.modal.open .sheet{transform:none}
@media (min-width:700px){ .modal{align-items:center} .sheet{border-radius:28px;max-height:88vh} }
.sheet-head{display:flex;align-items:center;gap:10px;padding:18px 18px 8px}
.sheet-head h2{flex:1;font-size:26px;letter-spacing:-.04em}
.sheet-body{padding:6px 18px 18px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;flex:1}
.sheet-foot{display:flex;gap:8px;padding:10px 18px calc(var(--sab) + 16px);flex-wrap:wrap}
.sheet-foot .btn{flex:1}
.field{margin:14px 0;min-width:0}
.field>label,.field>.lbl{display:block;font-size:13px;font-weight:600;margin:0 0 6px 4px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 4px 0}
.hint button{color:var(--accent-ink);font-weight:600;font-size:12.5px}
.in{display:block;width:100%;min-width:0;border:0;background:var(--surface);color:var(--ink);border-radius:16px;padding:13px 14px;font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.in:focus{box-shadow:0 0 0 2px var(--ink)}
.in::placeholder{color:var(--muted)}
input[type="date"].in,input[type="month"].in{min-height:48px;line-height:22px;text-align:left}
input[type="date"]::-webkit-date-and-time-value,input[type="month"]::-webkit-date-and-time-value{text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .field{margin:0}
.seg{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.seg[data-seg="mtype"]{grid-template-columns:1fr 1fr}
.seg button{background:var(--surface);border-radius:16px;padding:11px 8px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--strong);color:var(--strong-ink)}
.search-row{display:flex;gap:8px}
.search-row .in{flex:1}
.results{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.result{background:var(--surface);border-radius:18px;padding:12px 14px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%}
.result .n{font-weight:600;line-height:1.25}
.result .m{font-size:12.5px;color:var(--muted)}
.result .p{font-weight:600;text-align:right}
.result[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.result .warn{grid-column:1/-1;font-size:12.5px;color:var(--accent-ink)}
.msg{font-size:14px;color:var(--muted);padding:10px 4px}
.msg.err{color:var(--down)}
.chosen{background:var(--surface);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.chosen .n{flex:1;min-width:0;font-weight:600}
.chosen .m{font-size:12.5px;color:var(--muted);font-weight:400}
.link{color:var(--accent-ink);font-weight:600}
.pend{background:var(--surface);border-radius:22px;padding:14px;margin:10px 0}
.pend h4{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.pend .s{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.pend .field{margin:10px 0 0}
.pend .in{background:var(--surface-2)}
.pend .row{display:flex;gap:8px;margin-top:12px}
.pend .row .btn{flex:1;box-shadow:none}
.calc{font-size:13px;color:var(--ink-2);margin:8px 4px 0}

.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 20px);transform:translateX(-50%) translateY(20px);background:var(--strong);color:var(--strong-ink);border-radius:999px;padding:12px 18px;font-weight:600;font-size:14px;opacity:0;transition:all .25s;z-index:80;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:420px){
  .top h1{font-size:34px}
  .sum-big{font-size:36px}
  .d-main .v{font-size:36px}
}

/* Privacidad */
body.priv .spark svg, body.priv .chart.pos svg, body.priv .donut-wrap svg{filter:blur(7px);opacity:.55}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.d-top .back{margin-bottom:0}
.icon-btn.on{background:var(--strong);color:var(--strong-ink)}
.pin-in{font-size:30px!important;letter-spacing:.6em;text-align:center;padding-left:.6em!important}
.pin-err{color:var(--down);font-size:14px;text-align:center;min-height:20px;margin-top:10px}
.pin-note{color:var(--ink-2);font-size:14px;margin:0 4px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* Resumen en dos páginas: Resumen y Reparto */
.summary{padding:0;overflow:hidden;
  --d0:#E8613C; --d1:#B9B8B4; --d2:#F1EDE6; --d3:#6E8FD1; --d4:#5DAE8B; --d5:#A57FD6; --d6:#D9B26F; --d7:rgba(150,150,150,.55)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .summary{
  --d0:#D8532E; --d1:#8F8E89; --d2:#141414; --d3:#4F72C2; --d4:#3E8F6C; --d5:#8A63C2; --d6:#B98D3E; --d7:rgba(20,20,20,.3)}}
:root[data-theme="dark"] .summary{--d0:#D8532E; --d1:#8F8E89; --d2:#141414; --d3:#4F72C2; --d4:#3E8F6C; --d5:#8A63C2; --d6:#B98D3E; --d7:rgba(20,20,20,.3)}
.sum-pages{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.sum-pages::-webkit-scrollbar{display:none;width:0;height:0;background:transparent}
.sum-pages{-ms-overflow-style:none;padding-bottom:24px;margin-bottom:-24px}
.sum-page{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;padding:20px 20px 12px}
.sum-dots{display:flex;justify-content:center;gap:6px;padding:2px 0 14px}
.sum-dots button{width:7px;height:7px;border-radius:999px;background:currentColor;opacity:.3;transition:all .2s}
.sum-dots button[aria-current="true"]{opacity:.9;width:20px}
.rep-body{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:16px}
.donut-wrap{position:relative;width:136px;height:136px;flex:none}
.donut-wrap svg{width:100%;height:100%;display:block}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15;padding:0 26px}
.donut-c b{font-size:19px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.donut-c span{font-size:11.5px;opacity:.65}
.rep-list{flex:1 1 auto;max-width:340px;min-width:0;display:flex;flex-direction:column;gap:8px}
@media (min-width:600px){ .rep-foot{display:flex;justify-content:center} .rep-body{gap:36px;margin:22px 0 6px} .donut-wrap{width:172px;height:172px} .donut-c b{font-size:22px} .rep-row{font-size:14.5px} }
.rep-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px}
.rep-row i{width:10px;height:10px;border-radius:50%}
.rep-row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.8}
.rep-row .v{font-weight:600}
.rep-foot{margin-top:16px}
.rep-empty{opacity:.65;font-size:14px;padding:30px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <main id="list">
    <div class="top">
      <h1>Inversiones</h1>
      <button class="icon-btn" id="eyeBtn" data-act="eye" aria-label="Mostrar cifras"></button>
      <button class="icon-btn" id="refreshBtn" aria-label="Actualizar cotizaciones" title="Actualizar cotizaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
    <section class="summary" id="summary"></section>
    <div id="banners"></div>
    <section class="grid" id="grid"></section>
    <footer class="foot">
      <div class="row">
        <button class="btn small" id="backupBtn">Guardar copia</button>
        <button class="btn small" id="restoreBtn">Restaurar copia</button>
        <button class="btn small" id="clearExBtn" hidden>Borrar ejemplos</button>
        <button class="btn small" id="changePinBtn" hidden>Cambiar PIN</button>
      </div>
      <div class="status" id="status"></div>
      <div id="appVer"></div>
    </footer>
  </main>
  <main id="detail" hidden></main>
</div>

<script>
"use strict";
const APP_VERSION = "Versión 4 · 27 oct 2026";
// Worker de Cloudflare que consulta las cotizaciones (Yahoo Finance)
const PRICE_API = "https://finanzas-cotizaciones.racksvibes.workers.dev";
const KEY = "inversiones-v1", PKEY = "inversiones-precios-v1", PINKEY = "inversiones-pin-v1";
const MASK = "•••••";
const priv = () => !ui.reveal;
const PRICE_TTL = 4 * 3600e3; // vuelve a pedir cotizaciones cada 4 horas

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const pd = s => new Date(s + "T12:00:00");
const daysBetween = (a, b) => (pd(b) - pd(a)) / 864e5;
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fdate = s => { if (!s) return "—"; const [y,m,d] = s.split("-"); return `${+d} ${MESES[+m-1]} ${y}`; };
const fdateShort = s => { const [y,m,d] = s.split("-"); return `${+d} ${MESES[+m-1]}`; };
const fmonth = ym => { const [y,m] = ym.split("-"); return `${MESES_L[+m-1]} ${y}`; };
function parseNum(s){
  if (s == null) return NaN;
  s = String(s).trim().replace(/\s|€/g, "");
  if (!s) return NaN;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  return Number(s);
}
function fmtNum(n, dec = 2){
  if (n == null || !isFinite(n)) return "—";
  const neg = n < 0 && Math.abs(n) >= 0.5 * Math.pow(10, -dec);
  let [i, f] = Math.abs(n).toFixed(dec).split(".");
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return (neg ? "−" : "") + i + (f ? "," + f : "");
}
const eur = (n, dec = 2) => priv() ? MASK : fmtNum(n, dec) + " €";
const eurS = n => priv() ? MASK : (n > 0.004 ? "+" : "") + eur(n);
const pct = (n, dec = 2) => priv() ? MASK : (n == null || !isFinite(n)) ? "—" : ((n > 0.00005 ? "+" : "") + fmtNum(n * 100, dec) + " %");
const navDec = n => n >= 1000 ? 2 : n >= 1 ? 4 : 6;
const fnav = n => (n == null || !isFinite(n)) ? "—" : fmtNum(n, navDec(n)) + " €";
const fUnits = n => { if (priv()) return MASK; const s = fmtNum(n, Math.abs(n) >= 100 ? 4 : 6); return s.includes(",") ? s.replace(/0+$/, "").replace(/,$/, "") : s; };
const tone = n => priv() ? "" : n > 0.004 ? "up" : n < -0.004 ? "down" : "";
const ISIN_RE = /^[A-Z]{2}[A-Z0-9]{9}\d$/;
const TYPES = { fondo:"Fondo", etf:"ETF", cripto:"Cripto", accion:"Acción", otro:"Otro" };
const MOVE_TYPES = { aportacion:"Aportación", venta:"Venta", traspaso_in:"Traspaso de entrada", traspaso_out:"Traspaso de salida" };
const IN = t => t === "aportacion" || t === "traspaso_in";

const ICON = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};

/* ---------- datos ---------- */
let state = load();
let prices = loadPrices();
const ui = { view:"list", id:null, mode:"total", range:"all", chart:"pos", allMoves:false, reveal:false, sumPage:0, rep:"pct", repBy:"inv" };
let priceStatus = "";

function load(){

    const raw = localStorage.getItem(KEY);
    if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.investments)) return s; }
  } catch {}
  return { version:1, investments: makeExamples(), lastBackup:null, lastChange:null };
}
function save(changed = true){
  if (changed) state.lastChange = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { toast("No se pudo guardar en el dispositivo"); }
}
function loadPrices(){ try { return JSON.parse(localStorage.getItem(PKEY)) || {}; } catch { return {}; } }
function savePrices(){ try { localStorage.setItem(PKEY, JSON.stringify(prices)); } catch {} }
const getInv = id => state.investments.find(x => x.id === id);

/* ---------- ejemplos (se pueden borrar) ---------- */
function makeExamples(){
  const mk = (name, isin, symbol, type, amount, start, navs, last, periodicFrom) => {

  return [

      ["2026-10-23", 14.4379], "2026-11"),
    mk("Horos Value Internacional FI", "ES0146309002", "0P0001DFE8.F", "fondo", 100, "2024-06",
      [160.1022,156.3784,147.1363,151.1765,160.8793,157.4567,161.351,163.8258,169.6266,170.9779,150.9574,168.1353,178.7825,185.1238,192.2124,196.6926,203.8659,204.0216,203.1211,209.6585,204.9223,204.4396,204.4798,217.3627,215.7151,216.5416,221.853,221.5222],
      ["2026-10-23", 210.9359], "2026-10"),
    mk("Bitcoin", "", "BTC-EUR", "cripto", 50, "2025-01",
      [95403,92911,83955,76193,83757,88688,91887,98580,94398,105458,90374,76757,80141,53243,61035,59933,69081,52871,55564,55894,68731,76473],
      ["2026-10-26", 71452.54], "2026-11"),
  ];
}

/* ---------- cálculos ---------- */
const memo = new Map();
function sortedMoves(inv){ return [...inv.movements].sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }
function getSeries(inv){
  const k = "s:" + inv.id; if (memo.has(k)) return memo.get(k);
  const map = new Map();
  for (const m of inv.movements) if (m.nav > 0) map.set(m.date, m.nav);
  for (const [d, v] of (inv.manualPrices || [])) if (v > 0) map.set(d, v);
  const P = inv.symbol && prices[inv.symbol];
  if (P && P.points) { for (const [d, v] of P.points) map.set(d, v); if (P.priceDate && P.price > 0) map.set(P.priceDate, P.price); }
  const dates = [...map.keys()].sort(); const vals = dates.map(d => map.get(d));
  const S = { dates, vals }; memo.set(k, S); return S;
}
function priceAt(S, date){
  let lo = 0, hi = S.dates.length - 1, r = -1;
  while (lo <= hi){ const mid = (lo + hi) >> 1; if (S.dates[mid] <= date){ r = mid; lo = mid + 1; } else hi = mid - 1; }
  return r < 0 ? null : { date: S.dates[r], v: S.vals[r] };
}
function applyMove(st, m){
  const u = +m.units || 0, a = +m.amount || 0;
  if (IN(m.type)){ st.units += u; st.cost += a; st.invested += a; }
  else {
    const avg = st.units > 0 ? st.cost / st.units : 0, c = avg * Math.min(u, st.units);
    st.realized += a - c; st.cost -= c; st.units -= u; st.withdrawn += a;
    if (st.units < 1e-9){ st.units = 0; st.cost = 0; }
  }
}
function position(inv, upto){
  const st = { units:0, cost:0, invested:0, withdrawn:0, realized:0 };
  for (const m of sortedMoves(inv)){ if (upto && m.date > upto) break; applyMove(st, m); }
  return st;
}
function xirr(flows){
  if (flows.length < 2) return null;
  if (!flows.some(f => f.a < 0) || !flows.some(f => f.a > 0)) return null;
  const t0 = flows[0].d;
  const ts = flows.map(f => daysBetween(t0, f.d) / 365.25);
  const npv = r => flows.reduce((s, f, i) => s + f.a / Math.pow(1 + r, ts[i]), 0);
  let lo = -0.9999, hi = 10, flo = npv(lo), fhi = npv(hi);
  if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return null;
  for (let i = 0; i < 200; i++){
    const mid = (lo + hi) / 2, f = npv(mid);
    if (Math.abs(f) < 1e-7) return mid;
    if (f * flo < 0){ hi = mid; } else { lo = mid; flo = f; }
  }
  return (lo + hi) / 2;
}
function invFlows(inv){ return sortedMoves(inv).map(m => ({ d:m.date, a: IN(m.type) ? -(+m.amount||0) : (+m.amount||0) })); }

function metrics(inv){
  const k = "m:" + inv.id; if (memo.has(k)) return memo.get(k);
  const S = getSeries(inv), td = today();
  const p = position(inv);
  const last = S.dates.length ? { date:S.dates[S.dates.length-1], v:S.vals[S.vals.length-1] } : null;
  const price = last ? last.v : null;
  const value = price != null ? p.units * price : p.cost;
  const gain = value + p.withdrawn - p.invested;
  const gainPct = p.invested > 0 ? gain / p.invested : null;
  const flows = invFlows(inv);
  const span = flows.length ? daysBetween(flows[0].d, td) : 0;
  const tir = span >= 180 && value > 0 ? xirr([...flows, { d:td, a:value }]) : null;
  // Este año (YTD)
  const y = new Date().getFullYear(), dec31 = `${y-1}-12-31`;
  const ps = position(inv, dec31);
  const sp = priceAt(S, dec31);
  const startValue = ps.units > 0 ? (sp ? ps.units * sp.v : ps.cost) : 0;
  const T = Math.max(1, daysBetween(dec31, td));
  let net = 0, w = 0, addedY = 0;
  for (const m of sortedMoves(inv)){
    if (m.date <= dec31) continue;
    const c = IN(m.type) ? (+m.amount||0) : -(+m.amount||0);
    net += c; w += c * Math.max(0, daysBetween(m.date, td)) / T;
    if (IN(m.type)) addedY += +m.amount || 0;
  }
  const ytdGain = value - startValue - net;
  const ytdBase = startValue + w;
  const r = { value, cost:p.cost, units:p.units, invested:p.invested, withdrawn:p.withdrawn, realized:p.realized,
    price, priceDate: last && last.date, gain, gainPct, tir, flows,
    startValue, ytdNet:net, ytdAdded:addedY, ytdGain, ytdBase, ytdPct: ytdBase > 0 ? ytdGain / ytdBase : null,
    avgCost: p.units > 0 ? p.cost / p.units : null };
  memo.set(k, r); return r;
}
function totals(){
  const t = { value:0, cost:0, invested:0, gain:0, ytdGain:0, ytdBase:0, ytdNet:0, flows:[] };
  for (const inv of state.investments){
    const m = metrics(inv);
    t.value += m.value; t.cost += m.cost; t.invested += m.invested; t.gain += m.gain;
    t.ytdGain += m.ytdGain; t.ytdBase += m.ytdBase; t.ytdNet += m.ytdNet; t.flows.push(...m.flows);
  }
  t.flows.sort((a,b) => a.d < b.d ? -1 : 1);
  const span = t.flows.length ? daysBetween(t.flows[0].d, today()) : 0;
  t.gainPct = t.invested > 0 ? t.gain / t.invested : null;
  t.ytdPct = t.ytdBase > 0 ? t.ytdGain / t.ytdBase : null;
  t.tir = span >= 180 && t.value > 0 ? xirr([...t.flows, { d:today(), a:t.value }]) : null;
  return t;
}

/* Evolución: valor de la posición y lo aportado, día a día */
function positionSeries(inv, from){
  const S = getSeries(inv), mv = sortedMoves(inv);
  if (!mv.length) return null;
  const td = today(), first = mv[0].date;
  const set = new Set(); for (const d of S.dates) if (d >= first) set.add(d);
  for (const m of mv) set.add(m.date); set.add(td);
  const ds = [...set].sort();
  const st = { units:0, cost:0, invested:0, withdrawn:0, realized:0 };
  const out = { d:[], v:[], c:[] }; let i = 0;
  for (const d of ds){
    while (i < mv.length && mv[i].date <= d) applyMove(st, mv[i++]);
    if (from && d < from) continue;
    const p = priceAt(S, d); if (!p) continue;
    out.d.push(d); out.v.push(st.units * p.v); out.c.push(st.cost);
  }
  return out.d.length ? out : null;
}
function priceSeries(inv, from){
  const S = getSeries(inv); const out = { d:[], v:[] };
  S.dates.forEach((d, i) => { if (!from || d >= from){ out.d.push(d); out.v.push(S.vals[i]); } });
  return out.d.length ? out : null;
}
function thin(ser, max){
  const n = ser.d.length; if (n <= max) return ser;
  const step = Math.ceil(n / max), o = {};
  for (const k of Object.keys(ser)) o[k] = ser[k].filter((_, i) => i % step === 0 || i === n - 1);
  return o;
}
function rangeStart(r){
  const d = new Date();
  if (r === "1m") d.setMonth(d.getMonth() - 1);
  else if (r === "6m") d.setMonth(d.getMonth() - 6);
  else if (r === "1y") d.setFullYear(d.getFullYear() - 1);
  else if (r === "ytd") return `${d.getFullYear()-1}-12-31`;
  else return null;
  return iso(d);
}

/* ---------- aportaciones periódicas pendientes ---------- */
function pendingFor(inv){
  const P = inv.periodic; if (!P || !P.active || !P.from) return [];
  const out = [], now = new Date(), td = today();
  const done = new Set(inv.movements.filter(m => m.period).map(m => m.period));
  const skipped = new Set(inv.skipped || []);
  let [y, m] = P.from.split("-").map(Number);
  for (let guard = 0; guard < 240; guard++){
    const ym = `${y}-${pad(m)}`;
    const last = new Date(y, m, 0).getDate();
    const date = `${ym}-${pad(Math.min(P.day || 1, last))}`;
    if (date > td) break;
    if (!done.has(ym) && !skipped.has(ym)) out.push({ inv, ym, date, amount:P.amount });
    m++; if (m > 12){ m = 1; y++; }
    if (y > now.getFullYear() + 1) break;
  }
  return out;
}
const allPending = () => state.investments.flatMap(pendingFor);

/* ---------- cotizaciones (Worker) ---------- */
async function api(path){
  const r = await fetch(PRICE_API + path, { cache:"no-store" });
  let d = null; try { d = await r.json(); } catch {}
  if (!r.ok || !d || d.error) throw new Error((d && d.error) || ("Error " + r.status));
  return d;
}
let refreshing = false;
async function refreshPrices(force = false){
  if (refreshing) return;
  const syms = [...new Set(state.investments.map(i => i.symbol).filter(Boolean))]
    .filter(s => force || !prices[s] || Date.now() - prices[s].t > PRICE_TTL);
  if (!syms.length){ renderStatus(); return; }
  refreshing = true; $("#refreshBtn").classList.add("spin");
  let ok = 0, fail = 0;
  await Promise.all(syms.map(async s => {
    try {
      const d = await api("/chart?s=" + encodeURIComponent(s));
      prices[s] = { t: Date.now(), name: d.name, price: d.price, priceDate: d.priceDate, orig: d.originalCurrency, points: d.points };
      ok++;
    } catch(e){ fail++; console.warn("cotización", s, e); }
  }));
  refreshing = false; $("#refreshBtn").classList.remove("spin");
  if (ok) savePrices();
  priceStatus = fail && !ok ? "No se pudo conectar con las cotizaciones: se usa el último valor conocido."
    : fail ? `No se pudieron actualizar ${fail} cotizaciones.` : "";
  memo.clear(); renderAll();
  if (force) toast(fail && !ok ? "Sin conexión con las cotizaciones" : "Cotizaciones actualizadas");
}

/* ---------- gráficas (SVG propio) ---------- */
function scale(d, vals, W, H, padT, padB){
  const t0 = pd(d[0]).getTime(), t1 = pd(d[d.length-1]).getTime();
  let min = Infinity, max = -Infinity;
  for (const arr of vals) for (const v of arr){ if (v < min) min = v; if (v > max) max = v; }
  if (min === max){ min -= Math.abs(min) * 0.05 || 1; max += Math.abs(max) * 0.05 || 1; }
  const span = max - min; min -= span * 0.06; max += span * 0.06;
  const x = s => t1 === t0 ? W / 2 : (pd(s).getTime() - t0) / (t1 - t0) * W;
  const y = v => padT + (1 - (v - min) / (max - min)) * (H - padT - padB);
  return { x, y, min, max };
}
const pathOf = (d, v, sc, ox = 0) => d.map((s, i) => (i ? "L" : "M") + (ox + sc.x(s)).toFixed(1) + " " + sc.y(v[i]).toFixed(1)).join("");

function sparkSVG(inv){
  const ser = positionSeries(inv);
  if (!ser || ser.d.length < 2) return `<svg viewBox="0 0 300 64"></svg>`;
  const s = thin(ser, 90), W = 300, H = 64;
  const sc = scale(s.d, [s.v, s.c], W, H, 4, 4);
  const pv = pathOf(s.d, s.v, sc), pc = pathOf(s.d, s.c, sc);
  const area = pv + `L${W} ${H}L0 ${H}Z`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${area}" fill="var(--ink)" opacity=".05"/>
    <path d="${pc}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
    <path d="${pv}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function drawDetailChart(inv){
  const box = $("#chartBox"); if (!box) return;
  const from = rangeStart(ui.range);
  const isPos = ui.chart === "pos";
  box.classList.toggle("pos", isPos);
  let ser = isPos ? positionSeries(inv, from) : priceSeries(inv, from);
  if (!ser || ser.d.length < 2){ box.innerHTML = `<div class="no-data">Aún no hay datos suficientes para este periodo.</div>`; return; }
  ser = thin(ser, 260);
  const W = Math.max(240, box.clientWidth), H = box.clientHeight || 220, padR = 52, padB = 22, padT = 10;
  const PW = W - padR;
  const sc = scale(ser.d, isPos ? [ser.v, ser.c] : [ser.v], PW, H, padT, padB);
  const ticks = [0, 0.5, 1].map(f => sc.min + (sc.max - sc.min) * (0.06 / 1.12 + f * (1 / 1.12)));
  const tickLbl = v => isPos && priv() ? "" : isPos ? (Math.abs(v) >= 10000 ? fmtNum(v / 1000, 1) + "k" : fmtNum(v, 0)) : fmtNum(v, v >= 1000 ? 0 : 2);
  let g = "";
  for (const t of ticks){ const yy = sc.y(t).toFixed(1); g += `<line x1="0" x2="${PW}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${W-2}" y="${(+yy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${tickLbl(t)}</text>`; }
  g += `<text x="0" y="${H-4}" font-size="11" fill="var(--muted)">${fdate(ser.d[0])}</text><text x="${PW}" y="${H-4}" text-anchor="end" font-size="11" fill="var(--muted)">${fdate(ser.d[ser.d.length-1])}</text>`;
  let lines = "";
  if (isPos){
    const pv = pathOf(ser.d, ser.v, sc);
    lines += `<path d="${pv}L${PW} ${H-padB}L0 ${H-padB}Z" fill="var(--ink)" opacity=".05"/>`;
    lines += `<path d="${pathOf(ser.d, ser.c, sc)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 5"/>`;
    lines += `<path d="${pv}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>`;
  } else {
    lines += `<path d="${pathOf(ser.d, ser.v, sc)}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>`;
    const S = getSeries(inv);
    for (const m of sortedMoves(inv)){
      if (from && m.date < from) continue;
      const p = m.nav > 0 ? m.nav : (priceAt(S, m.date) || {}).v; if (!p) continue;
      const col = IN(m.type) ? "var(--accent)" : "var(--down)";
      lines += `<circle cx="${sc.x(m.date).toFixed(1)}" cy="${sc.y(p).toFixed(1)}" r="4.5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;
    }
  }
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${isPos ? "Evolución del valor de la posición y lo aportado" : "Evolución del precio"}">
    ${g}${lines}<g id="cross" style="display:none"><line id="cx" y1="${padT}" y2="${H-padB}" stroke="var(--ink)" stroke-width="1" opacity=".35"/><circle id="cd1" r="5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>${isPos ? `<circle id="cd2" r="4.5" fill="var(--muted)" stroke="var(--surface)" stroke-width="2"/>` : ""}</g>
  </svg><div class="tip" id="tip" hidden></div>`;
  const svg = box.querySelector("svg"), tip = $("#tip"), cross = svg.querySelector("#cross");
  const xs = ser.d.map(d => sc.x(d));
  const show = ev => {

const TYPES_PL = { fondo:"Fondos", etf:"ETF", cripto:"Cripto", accion:"Acciones", otro:"Otros" };
const TYPE_COLOR = { fondo:0, etf:1, cripto:2, accion:3, otro:4 };
function repartoData(){
  const items = [];
  if (ui.repBy === "type"){
    const m = new Map();
    for (const inv of state.investments){ const v = metrics(inv).value, k = TYPES[inv.type] ? inv.type : "otro"; if (v > 0) m.set(k, (m.get(k) || 0) + v); }
    for (const [k, v] of m) items.push({ name: TYPES_PL[k], v, c: TYPE_COLOR[k] });
  } else {
    state.investments.forEach((inv, i) => { const v = metrics(inv).value; if (v > 0) items.push({ name: inv.name, v, c: i }); });
  }
  items.sort((a, b) => b.v - a.v);
  const total = items.reduce((s, x) => s + x.v, 0);
  // como mucho 7 colores fijos por inversión; el resto se agrupa en «Otras»
  // se ven como mucho 6 (las de más peso) y el resto se agrupa en «Otras», así nunca se desborda
  let shown = items, rest = [];
  if (items.length > 7){ shown = items.slice(0, 6); rest = items.slice(6); }
  // cada una conserva su color; si su color pasa de los 7 disponibles, toma uno libre
  const used = new Set(shown.filter(x => x.c < 7).map(x => x.c));
  shown = shown.map(x => { if (x.c < 7) return x; let c = 0; while (used.has(c)) c++; used.add(c); return { ...x, c }; });
  if (rest.length) shown.push({ name: `Otras (${rest.length})`, v: rest.reduce((s, x) => s + x.v, 0), c: 7 });
  return { items: shown, total, count: items.length };
}
function donutSVG(items, total){
  const C = 68, r = 56, sw = 16;
  if (!total) return `<svg viewBox="0 0 136 136" aria-hidden="true"><circle cx="${C}" cy="${C}" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="${sw}"/></svg>`;
  if (items.length === 1) return `<svg viewBox="0 0 136 136" aria-hidden="true"><circle cx="${C}" cy="${C}" r="${r}" fill="none" stroke="var(--d${items[0].c})" stroke-width="${sw}"/></svg>`;
  const cap = (sw / 2) / r * 180 / Math.PI, gap = 2 * cap + 5;
  const pt = a => { const t = a * Math.PI / 180; return [(C + r * Math.cos(t)).toFixed(2), (C + r * Math.sin(t)).toFixed(2)]; };
  let a = -90, out = "";
  for (const it of items){
    const span = it.v / total * 360, a0 = a + gap / 2, a1 = a + span - gap / 2;
    if (a1 - a0 > 0.5){
      const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
      out += `<path d="M${x0} ${y0}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}" fill="none" stroke="var(--d${it.c})" stroke-width="${sw}" stroke-linecap="round"/>`;
    } else { const [x, y] = pt(a + span / 2); out += `<circle cx="${x}" cy="${y}" r="${sw / 2}" fill="var(--d${it.c})"/>`; }
    a += span;
  }
  return `<svg viewBox="0 0 136 136" role="img" aria-label="Reparto de la cartera">${out}</svg>`;
}
function repartoHTML(){
  const { items, total, count } = repartoData();
  const head = `<div class="sum-head"><span class="sum-lbl">Reparto</span>
    <div class="seg-mini" role="group" aria-label="Unidad"><button data-rep="pct" aria-pressed="${ui.rep === "pct"}">%</button><button data-rep="eur" aria-pressed="${ui.rep === "eur"}">€</button></div></div>`;
  const foot = `<div class="rep-foot"><div class="seg-mini" role="group" aria-label="Agrupar">
    <button data-repby="inv" aria-pressed="${ui.repBy === "inv"}">Por inversión</button><button data-repby="type" aria-pressed="${ui.repBy === "type"}">Por tipo</button></div></div>`;
  if (!total) return head + `<div class="rep-empty">Cuando añadas inversiones verás aquí cómo se reparte tu dinero.</div>` + foot;
  const val = v => priv() ? MASK : ui.rep === "eur" ? fmtNum(v, 0) + " €" : fmtNum(v / total * 100, 1) + " %";
  const center = ui.rep === "eur"
    ? `<b>${priv() ? MASK : fmtNum(total, 0) + " €"}</b><span>en total</span>`
    : "";
  return head + `<div class="rep-body"><div class="donut-wrap">${donutSVG(items, total)}<div class="donut-c num">${center}</div></div>
    <div class="rep-list num">${items.map(it => `<div class="rep-row"><i style="background:var(--d${it.c})"></i><span class="n">${esc(it.name)}</span><span class="v">${val(it.v)}</span></div>`).join("")}</div></div>` + foot;
}

const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';

const eyeIcon = () => ui.reveal ? EYE : EYE_OFF;
function getPin(){ try { return JSON.parse(localStorage.getItem(PINKEY)); } catch { return null; } }
async function hashPin(pin, salt){
  const data = new TextEncoder().encode(salt + ":" + pin);
  if (window.crypto && crypto.subtle){
    const h = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  let h = 5381; for (const c of data) h = ((h * 33) ^ c) >>> 0; return "x" + h.toString(16);
}
function reveal(){ ui.reveal = true; renderAll(); }
function hideNow(){ if (!ui.reveal) return; ui.reveal = false; renderAll(); }
function needReveal(cb){ if (ui.reveal) cb(); else askPin(() => { ui.reveal = true; renderAll(); cb(); }); }
let pinFails = 0, pinLockUntil = 0;
function askPin(onOk){
  const P = getPin();
  if (!P) return createPin(onOk, true);
  const body = `<p class="pin-note">Introduce tu PIN para ver las cifras.</p>
    <div class="field"><input class="in pin-in" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="${P.len}" autocomplete="off" aria-label="PIN"></div>
    <div class="pin-err" id="pinErr"></div>
    <p class="hint" style="text-align:center"><button id="forgot">¿Has olvidado el PIN?</button></p>`;
  openSheet("Mostrar cifras", body, "", root => {
    const inp = root.querySelector("#pin"), err = root.querySelector("#pinErr");
    const check = async () => {
      if (Date.now() < pinLockUntil){ err.textContent = "Demasiados intentos. Espera unos segundos."; inp.value = ""; return; }
      const ok = (await hashPin(inp.value, P.salt)) === P.hash;
      if (ok){ pinFails = 0; closeSheet(true); onOk(); return; }
      pinFails++; inp.value = "";
      if (pinFails >= 5){ pinLockUntil = Date.now() + 30000; pinFails = 0; err.textContent = "Demasiados intentos. Espera 30 segundos."; }
      else err.textContent = "PIN incorrecto";
      inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake");
    };
    inp.addEventListener("input", () => { inp.value = inp.value.replace(/\D/g, ""); err.textContent = ""; if (inp.value.length === P.len) check(); });
    root.querySelector("#forgot").onclick = forgotPin;
    setTimeout(() => inp.focus(), 250);
  });
}
function createPin(onOk, first){
  const body = `<p class="pin-note">${first ? "Para ver las cifras necesitas un PIN. Elige uno de 4 a 6 números; te lo pediremos cada vez que quieras mostrarlas." : "Elige un PIN nuevo de 4 a 6 números."}</p>
    <div class="field"><label for="pin1">PIN</label><input class="in pin-in" id="pin1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></div>
    <div class="field"><label for="pin2">Repite el PIN</label><input class="in pin-in" id="pin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></div>
    <div class="pin-err" id="pinErr"></div>
    <p class="hint">Si lo olvidas no se puede recuperar: tendrías que borrar los datos de la app y restaurar tu copia de seguridad.</p>`;
  openSheet(first ? "Crea tu PIN" : "Cambiar PIN", body, `<button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">Guardar</button>`, root => {
    const a = root.querySelector("#pin1"), b = root.querySelector("#pin2"), err = root.querySelector("#pinErr");
    [a, b].forEach(x => x.addEventListener("input", () => { x.value = x.value.replace(/\D/g, ""); err.textContent = ""; }));
    root.querySelector("#ok").onclick = async () => {
      if (!/^\d{4,6}$/.test(a.value)){ err.textContent = "El PIN tiene que tener de 4 a 6 números"; return; }
      if (a.value !== b.value){ err.textContent = "Los dos PIN no coinciden"; b.value = ""; return; }
      const salt = [...crypto.getRandomValues(new Uint8Array(12))].map(x => x.toString(16).padStart(2, "0")).join("");
      try { localStorage.setItem(PINKEY, JSON.stringify({ salt, hash: await hashPin(a.value, salt), len: a.value.length })); }
      catch { err.textContent = "No se pudo guardar el PIN"; return; }
      closeSheet(true); toast("PIN guardado"); onOk && onOk();
    };
    setTimeout(() => a.focus(), 250);
  });
}
function forgotPin(){
  openSheet("¿Has olvidado el PIN?", `<p class="pin-note">Por seguridad, el PIN no se puede recuperar. Lo que sí puedes hacer es borrar los datos de la app en este dispositivo (se quita también el PIN) y después pulsar «Restaurar copia» para recuperar tu última copia de seguridad. Luego eliges un PIN nuevo.</p><div id="fpBox"></div>`,

/* ---------- hoja genérica ---------- */
let sheetEl = null;
function openSheet(title, body, foot, onMount){
  closeSheet(true);
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Cerrar">${ICON.close}</button></div>
    <div class="sheet-body">${body}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ""}</div>`;
  document.body.appendChild(m); sheetEl = m;
  m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-close]")) closeSheet(); });
  requestAnimationFrame(() => m.classList.add("open"));
  document.body.style.overflow = "hidden";
  onMount && onMount(m);
  return m;
}
function closeSheet(now){
  if (!sheetEl) return;
  const m = sheetEl; sheetEl = null; document.body.style.overflow = "";
  if (now) { m.remove(); return; }
  m.classList.remove("open"); setTimeout(() => m.remove(), 200);
}
function segHTML(name, opts, val){
  return `<div class="seg" data-seg="${name}">${Object.entries(opts).map(([k,l]) => `<button type="button" data-v="${k}" aria-pressed="${k === val}">${l}</button>`).join("")}</div>`;
}
function bindSeg(root, name, cb){
  const el = root.querySelector(`[data-seg="${name}"]`);
  el.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
    el.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); cb && cb(b.dataset.v); });
  return () => el.querySelector('[aria-pressed="true"]')?.dataset.v;
}

      root.querySelector("#backSearch").onclick = () => { root.querySelector("#stepSearch").hidden = false; root.querySelector("#stepForm").hidden = true; root.querySelector("#saveInv").disabled = true; };

        root.querySelectorAll('[data-seg="type"] button').forEach(b => b.setAttribute("aria-pressed", b.dataset.v === (chosen.type || "fondo")));
      }

      const v = q.value.trim(); if (v.length < 2) return;

/* ---------- movimientos ---------- */
function openMove(invId, moveId, preset){
  const inv = getInv(invId), mv = moveId ? inv.movements.find(x => x.id === moveId) : null;
  const S = getSeries(inv);
  const v = mv || Object.assign({ type:"aportacion", date: today(), amount:"", nav:"", units:"", fee:"" }, preset || {});
  const n2s = (n, dec) => (n === "" || n == null || !isFinite(+n) || +n === 0) ? "" : String(+(+n).toFixed(dec)).replace(".", ",");
  const body = `
    <div class="field"><span class="lbl">Tipo</span>${segHTML("mtype", MOVE_TYPES, v.type)}</div>
    <div class="two">
      <div class="field"><label for="mDate">Fecha</label><input class="in" type="date" id="mDate" value="${esc(v.date)}" max="${today()}"></div>
      <div class="field"><label for="mAmount" id="mAmountLbl">Importe (€)</label><input class="in" id="mAmount" inputmode="decimal" placeholder="0,00" value="${n2s(v.amount, 2)}"></div>
    </div>
    <div class="field"><label for="mNav">Valor liquidativo (€)</label><input class="in" id="mNav" inputmode="decimal" placeholder="Precio por participación" value="${n2s(v.nav, 6)}">
      <p class="hint" id="navHint"></p></div>
    <div class="field"><label for="mUnits">Participaciones</label><input class="in" id="mUnits" inputmode="decimal" placeholder="Se calculan solas" value="${n2s(v.units, 6)}">
      <p class="hint" id="unitsHint">Se calculan solas (importe ÷ valor liquidativo). Puedes cambiarlas si tu broker te da otra cifra.</p></div>
    <div class="field"><label for="mFee">Comisión (€, opcional)</label><input class="in" id="mFee" inputmode="decimal" placeholder="0" value="${v.fee ? n2s(v.fee, 2) : ""}">
      <p class="hint">Si pagas comisión, el importe es el total que sale de tu cuenta; las participaciones se calculan sin la comisión.</p></div>
    ${mv ? `<div id="delMove"></div>` : ""}`;
  const foot = `${mv ? `<button class="btn danger" id="del">Borrar</button>` : `<button class="btn" data-close>Cancelar</button>`}<button class="btn primary" id="ok">${mv ? "Guardar" : "Añadir"}</button>`;
  openSheet(mv ? "Editar movimiento" : `Nuevo movimiento`, body, foot, root => {
    const f = id => root.querySelector(id);
    let unitsTouched = !!mv, navAuto = false;
    const getT = bindSeg(root, "mtype", t => { f("#mAmountLbl").textContent = IN(t) ? "Importe (€)" : "Importe recibido (€)"; });
    f("#mAmountLbl").textContent = IN(v.type) ? "Importe (€)" : "Importe recibido (€)";
    const recalc = () => {
      if (unitsTouched) return;
      const a = parseNum(f("#mAmount").value), n = parseNum(f("#mNav").value), fee = parseNum(f("#mFee").value) || 0;
      const t = getT();
      if (a > 0 && n > 0){ const u = (IN(t) ? a - fee : a + fee) / n; f("#mUnits").value = String(+u.toFixed(6)).replace(".", ","); }
    };
    const suggest = () => {
      const d = f("#mDate").value; const hint = f("#navHint");
      const p = d ? priceAt(S, d) : null;
      if (p && daysBetween(p.date, d) <= 5){
        if (!f("#mNav").value || navAuto){ f("#mNav").value = String(+p.v.toFixed(6)).replace(".", ","); navAuto = true; recalc(); }
        hint.innerHTML = `Valor del ${fdate(p.date)}${p.date !== d ? " (último publicado)" : ""}: ${fnav(p.v)}. Si tu operación se ejecutó a otro valor, cámbialo.`;
      } else hint.textContent = inv.symbol ? "No hay valor publicado para esa fecha todavía: escríbelo tú." : "";
    };
    f("#mDate").addEventListener("change", suggest);
    f("#mAmount").addEventListener("input", recalc);
    f("#mFee").addEventListener("input", recalc);
    f("#mNav").addEventListener("input", () => { navAuto = false; recalc(); });
    f("#mUnits").addEventListener("input", () => { unitsTouched = f("#mUnits").value.trim() !== ""; });
    if (!mv) suggest();
    f("#ok").onclick = () => {
      const t = getT(), date = f("#mDate").value, amount = parseNum(f("#mAmount").value);
      let nav = parseNum(f("#mNav").value), units = parseNum(f("#mUnits").value); const fee = parseNum(f("#mFee").value) || 0;
      if (!date){ toast("Pon la fecha"); return; }
      if (!(amount > 0)){ toast("Pon el importe"); return; }
      if (!(nav > 0) && units > 0) nav = (IN(t) ? amount - fee : amount + fee) / units;
      if (!(units > 0) && nav > 0) units = (IN(t) ? amount - fee : amount + fee) / nav;
      if (!(nav > 0) || !(units > 0)){ toast("Pon el valor liquidativo o las participaciones"); return; }
      if (!IN(t)){ const pos = position({ movements: inv.movements.filter(x => x !== mv) }, date); if (units > pos.units + 1e-6){ toast(`En esa fecha solo tenías ${fUnits(pos.units)} participaciones`); return; } }
      const rec = { type:t, date, amount, nav, units, fee };
      if (mv) Object.assign(mv, rec);
      else inv.movements.push(Object.assign({ id: uid() }, rec, preset && preset.period ? { period: preset.period } : {}));
      if (inv.example) delete inv.example;
      save(); closeSheet(); renderAll(); toast(mv ? "Movimiento guardado" : "Movimiento añadido");
    };
    if (mv) f("#del").onclick = () => {
      f("#delMove").innerHTML = `<div class="confirm">¿Borrar este movimiento? No se puede deshacer.<div class="row"><button class="btn small flat" id="no">No</button><button class="btn small solid-danger" id="yes">Sí, borrar</button></div></div>`;
      f("#no").onclick = () => f("#delMove").innerHTML = "";
      f("#yes").onclick = () => { inv.movements = inv.movements.filter(x => x !== mv); save(); closeSheet(); renderAll(); toast("Movimiento borrado"); };
      f("#delMove").scrollIntoView({ behavior:"smooth", block:"nearest" });
    };
  });
}

/* ---------- aportación periódica ---------- */
function openPeriodic(id){
  const inv = getInv(id), P = inv.periodic || {};
  const d = new Date(), next = new Date(d.getFullYear(), d.getMonth() + 1, 1);
  const defFrom = P.from || `${next.getFullYear()}-${pad(next.getMonth()+1)}`;
  const body = `
    <p style="margin:0 0 4px;color:var(--ink-2);font-size:14px">Cada mes te aparecerá como pendiente. Al validarla pondrás la fecha real de ejecución y el valor liquidativo final.</p>
    <div class="two" style="margin-top:12px">
      <div class="field"><label for="pAmount">Importe mensual (€)</label><input class="in" id="pAmount" inputmode="decimal" value="${P.amount ? String(P.amount).replace(".", ",") : ""}" placeholder="0,00"></div>
      <div class="field"><label for="pDay">Día del mes</label><input class="in" id="pDay" inputmode="numeric" value="${P.day || 5}"></div>
    </div>
    <div class="field"><label for="pFrom">Primera aportación automática</label><input class="in" type="month" id="pFrom" value="${defFrom}">
      <p class="hint">Los meses anteriores los metes tú como movimientos normales.</p></div>`;
  const foot = `${inv.periodic ? `<button class="btn danger" id="off">Quitar</button>` : `<button class="btn" data-close>Cancelar</button>`}<button class="btn primary" id="ok">Guardar</button>`;
  openSheet("Aportación periódica", body, foot, root => {
    root.querySelector("#ok").onclick = () => {
      const amount = parseNum(root.querySelector("#pAmount").value), day = Math.round(parseNum(root.querySelector("#pDay").value)), from = root.querySelector("#pFrom").value;
      if (!(amount > 0)){ toast("Pon el importe"); return; }
      if (!(day >= 1 && day <= 31)){ toast("El día tiene que estar entre 1 y 31"); return; }
      if (!/^\d{4}-\d{2}$/.test(from)){ toast("Elige el mes de inicio"); return; }
      inv.periodic = { amount, day, from, active:true }; save(); closeSheet(); renderAll(); toast("Aportación periódica guardada");
    };
    const off = root.querySelector("#off");
    if (off) off.onclick = () => { inv.periodic = null; save(); closeSheet(); renderAll(); toast("Aportación periódica quitada"); };
  });
}
function openPending(onlyId){
  const list = (onlyId ? pendingFor(getInv(onlyId)) : allPending());
  if (!list.length){ toast("No hay aportaciones pendientes"); return; }
  const body = list.map((p, i) => {
    const S = getSeries(p.inv), pr = priceAt(S, p.date);
    const sug = pr && daysBetween(pr.date, p.date) <= 5 ? pr : null;
    return `<div class="pend" data-i="${i}">
      <h4>${esc(p.inv.name)}</h4><div class="s">${fmonth(p.ym)} · ${eur(p.amount)} previstos</div>
      <div class="two"><div class="field"><label>Fecha de ejecución</label><input class="in" type="date" data-f="date" value="${p.date}" max="${today()}"></div>
        <div class="field"><label>Importe (€)</label><input class="in" data-f="amount" inputmode="decimal" value="${String(p.amount).replace(".", ",")}"></div></div>
      <div class="two"><div class="field"><label>Valor liquidativo (€)</label><input class="in" data-f="nav" inputmode="decimal" placeholder="Escríbelo" value="${sug ? String(+sug.v.toFixed(6)).replace(".", ",") : ""}"></div>
        <div class="field"><label>Participaciones</label><input class="in" data-f="units" inputmode="decimal" placeholder="Se calculan solas"></div></div>
      <p class="hint" data-f="hint">${sug ? `Sugerido: valor del ${fdate(sug.date)}. Cámbialo si se ejecutó a otro.` : "Escribe el valor liquidativo al que se ejecutó."}</p>
      <div class="row"><button class="btn flat small" data-skip>Omitir mes</button><button class="btn primary small" data-ok>Validar</button></div>
    </div>`;
  }).join("");
  openSheet(list.length === 1 ? "Aportación pendiente" : "Aportaciones pendientes", body, "", root => {
    root.querySelectorAll(".pend").forEach(card => {
      const p = list[+card.dataset.i]; const f = k => card.querySelector(`[data-f="${k}"]`);
      let touched = false;
      const recalc = () => { if (touched) return; const a = parseNum(f("amount").value), n = parseNum(f("nav").value); f("units").value = a > 0 && n > 0 ? String(+(a / n).toFixed(6)).replace(".", ",") : ""; };
      recalc();
      f("amount").addEventListener("input", recalc); f("nav").addEventListener("input", recalc);
      f("units").addEventListener("input", () => { touched = f("units").value.trim() !== ""; });
      f("date").addEventListener("change", () => {
        const pr = priceAt(getSeries(p.inv), f("date").value);
        if (pr && daysBetween(pr.date, f("date").value) <= 5){ f("nav").value = String(+pr.v.toFixed(6)).replace(".", ","); f("hint").textContent = `Sugerido: valor del ${fdate(pr.date)}. Cámbialo si se ejecutó a otro.`; recalc(); }
      });
      const done = msg => { card.remove(); save(); toast(msg); if (!root.querySelector(".pend")){ closeSheet(); } renderAll(); };
      card.querySelector("[data-ok]").onclick = () => {
        const date = f("date").value, amount = parseNum(f("amount").value); let nav = parseNum(f("nav").value), units = parseNum(f("units").value);
        if (!date){ toast("Pon la fecha"); return; }
        if (!(amount > 0)){ toast("Pon el importe"); return; }
        if (!(nav > 0) && units > 0) nav = amount / units;
        if (!(units > 0) && nav > 0) units = amount / nav;
        if (!(nav > 0)){ toast("Pon el valor liquidativo"); return; }
        p.inv.movements.push({ id: uid(), type:"aportacion", date, amount, nav, units, fee:0, period: p.ym });
        if (p.inv.example) delete p.inv.example;
        done("Aportación validada");
      };
      card.querySelector("[data-skip]").onclick = () => { (p.inv.skipped = p.inv.skipped || []).push(p.ym); done(`${fmonth(p.ym)} omitido`); };
    });
  });
}
function openManualPrice(id){
  const inv = getInv(id);
  const body = `<div class="two"><div class="field"><label for="mpDate">Fecha</label><input class="in" type="date" id="mpDate" value="${today()}" max="${today()}"></div>
    <div class="field"><label for="mpVal">Valor (€)</label><input class="in" id="mpVal" inputmode="decimal" placeholder="Por participación"></div></div>`;
  openSheet("Actualizar valor", body, `<button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">Guardar</button>`, root => {

      inv.manualPrices = (inv.manualPrices || []).filter(x => x[0] !== d); inv.manualPrices.push([d, v]);
      save(); closeSheet(); renderAll(); toast("Valor actualizado");
    };
  });
}

/* ---------- copia de seguridad ---------- */
async function doBackup(){
  const data = JSON.stringify({ app:"inversiones", version:1, savedAt: new Date().toISOString(), investments: state.investments }, null, 1);
  const name = `inversiones-copia-${today()}.json`;
  const file = new File([data], name, { type:"application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title: name }); }
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
    state.lastBackup = Date.now(); save(false); renderAll(); toast("Copia de seguridad guardada");
  } catch(e){ if (e && e.name !== "AbortError") toast("No se pudo guardar la copia"); }
}
$("#fileIn").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!d || !Array.isArray(d.investments)) throw 0;
    const box = openSheet("Restaurar copia", `<p style="margin:0;font-size:15px">La copia es del <b>${d.savedAt ? fdate(d.savedAt.slice(0,10)) : "—"}</b> y tiene <b>${d.investments.length}</b> inversiones. Se sustituirán los datos que tienes ahora en este dispositivo.</p>`,
      `<button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">Restaurar</button>`);
    box.querySelector("#ok").onclick = () => { state.investments = d.investments; state.lastBackup = Date.now(); save(); closeSheet(); ui.view = "list"; renderAll(); refreshPrices(); toast("Copia restaurada"); };
  } catch { toast("Ese archivo no es una copia válida"); }
});

/* ---------- eventos ---------- */
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2400); }
function clearExamples(){
  state.investments = state.investments.filter(i => !i.example); save(); ui.view = "list"; renderAll(); toast("Ejemplos borrados");
}
document.addEventListener("click", e => {
  const t = e.target;
  const mode = t.closest("[data-mode]"); if (mode){ ui.mode = mode.dataset.mode; renderAll(); return; }
  const rep = t.closest("[data-rep]"); if (rep){ ui.rep = rep.dataset.rep; renderAll(); return; }
  const rb = t.closest("[data-repby]"); if (rb){ ui.repBy = rb.dataset.repby; renderAll(); return; }
  const pg = t.closest("[data-page]"); if (pg){ const sp = $("#sumPages"); sp.scrollTo({ left: +pg.dataset.page * sp.clientWidth, behavior:"smooth" }); return; }
  const q = t.closest("[data-quick]"); if (q){ e.stopPropagation(); quickAdd(q.dataset.quick); return; }
  const open = t.closest("[data-open]"); if (open){ ui.view = "detail"; ui.id = open.dataset.open; ui.range = "all"; ui.allMoves = false; renderAll(); window.scrollTo(0, 0); return; }
  const rg = t.closest("[data-range]"); if (rg){ ui.range = rg.dataset.range; document.querySelectorAll("[data-range]").forEach(b => b.setAttribute("aria-pressed", b === rg)); drawDetailChart(getInv(ui.id)); return; }
  const ch = t.closest("[data-chart]"); if (ch){ ui.chart = ch.dataset.chart; renderDetail(); return; }
  const mv = t.closest("[data-move]"); if (mv){ needReveal(() => openMove(ui.id, mv.dataset.move)); return; }
  const a = t.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "eye"){ ui.reveal ? hideNow() : askPin(reveal); }
  else if (act === "add") openAddInvestment();
  else if (act === "back"){ ui.view = "list"; renderAll(); window.scrollTo(0, 0); }
  else if (act === "pending") openPending(a.dataset.inv);
  else if (act === "backup") needReveal(doBackup);
  else if (act === "clearEx") clearExamples();
  else if (act === "addMove") openMove(ui.id);
  else if (act === "toggleMoves"){ ui.allMoves = !ui.allMoves; renderDetail(); }
  else if (act === "periodic") needReveal(() => openPeriodic(ui.id));
  else if (act === "editInv") openEditInv(ui.id);
  else if (act === "manualPrice") openManualPrice(ui.id);
  else if (act === "delInv"){
    const box = $("#delBox");
    box.innerHTML = `<div class="confirm">¿Borrar <b>${esc(getInv(ui.id).name)}</b> y todos sus movimientos? No se puede deshacer.<div class="row"><button class="btn small flat" id="no">No</button><button class="btn small solid-danger" id="yes">Sí, borrar</button></div></div>`;
    box.querySelector("#no").onclick = () => box.innerHTML = "";
    box.querySelector("#yes").onclick = () => { state.investments = state.investments.filter(i => i.id !== ui.id); save(); ui.view = "list"; renderAll(); toast("Inversión borrada"); };
    box.scrollIntoView({ behavior:"smooth", block:"center" });
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".card[data-open]")){ e.preventDefault(); e.target.click(); }
});
function quickAdd(id){
  const inv = getInv(id), pend = pendingFor(inv);
  if (pend.length) { openPending(id); return; }
  const preset = inv.periodic && inv.periodic.active ? { amount: inv.periodic.amount } : {};
  openMove(id, null, preset);
}
$("#refreshBtn").onclick = () => refreshPrices(true);
$("#backupBtn").onclick = () => needReveal(doBackup);
$("#changePinBtn").onclick = () => askPin(() => createPin(null, false));
$("#restoreBtn").onclick = () => $("#fileIn").click();
$("#clearExBtn").onclick = clearExamples;
let rzT; window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { if (ui.view === "detail") drawDetailChart(getInv(ui.id)); }, 150); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden"){ if (ui.reveal){ ui.reveal = false; closeSheet(true); renderAll(); } return; }
  memo.clear(); renderAll(); refreshPrices();
});
window.addEventListener("pagehide", () => { ui.reveal = false; });

if (!localStorage.getItem(KEY)) save(false);
renderAll();
refreshPrices();
</script>
</body>
